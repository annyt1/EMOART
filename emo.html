
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Emo Diary - Дневник Эмоций</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <h1>Дневник Эмоций</h1>

  <!-- Блок с цитатой --> 
  <div id="quote-container" style="text-align: center; font-style: italic; margin-bottom: 20px; color: #bbb;">
      <p id="quote">"Твои эмоции — это краски, которыми ты раскрашиваешь свой мир."</p>
  </div>

  <!-- Весь стеклянный блок с формой внутри -->
  <div class="glass-container">
    <form id="emotionForm">
      <label for="emotion">Выбери эмоцию:</label>
      <select id="emotion" required>
        <option value="">---</option>
        <option value="joy">😊 Радость</option>
        <option value="sadness">😢 Грусть</option>
        <option value="anger">😠 Злость</option>
        <option value="fear">😨 Страх</option>
        <option value="surprise">😲 Удивление</option>
        <option value="love">❤️ Любовь</option>
      </select>

      <label for="comment">Комментарий (кратко):</label>
      <input id="comment" type="text" maxlength="100" required placeholder="Опиши свои чувства..." />

      <button type="submit">Добавить запись</button>
    </form>
  </div>
 <div id="ai-buddy" class="glass-container ai-container" style="display: none;">
    <div class="ai-header">
        <div class="ai-status-dot"></div>
        <span class="ai-icon">🤖</span>
        <strong class="ai-title">Emo-Помощник</strong>
    </div>
    <div class="ai-content">
        <p id="ai-response"></p>
    </div>
</div>

  <!-- Блок визуализации -->
  <div style="text-align: center; margin-top: 40px;">
    <h2>Карта настроений</h2>
    <div id="visualization"></div>
  </div>

  <!-- Подключаем скрипт только один раз в конце -->
  <script src="script.js"></script>

</body>
</html>
